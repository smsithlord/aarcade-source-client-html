<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Interactive particles on Canvas API">
  <meta name="keywords" content="particles, canvas, js">
  <meta name="author" content="Zilfaron">
  <link rel="stylesheet" href="mp3particles/style.css">
  <!--link rel="icon" href="favicon.png" sizes="16x16"-->

  <title>Local Media Player</title>
  <style>
    body
    {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #playlist
    {
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      z-index: 200;
      background: rgba(0, 0, 0, 0.75);
      color: #ccc;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      max-height: 50%;
      width: 320px;
      display: flex;
      flex-direction: column;
      border-radius: 6px;
      overflow: hidden;
    }

    #playlistControls
    {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: row;
      flex-direction: row;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.9);
    }

    #playlistControls button
    {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 12px;
      border-radius: 3px;
      margin: 0 2px;
    }

    #playlistControls button:hover
    {
      background: #555;
    }

    #playlistTitle
    {
      -webkit-flex: 1;
      flex: 1;
      text-align: center;
      color: #fff;
      font-weight: bold;
      line-height: 24px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 6px;
    }

    #playlistTracks
    {
      overflow-y: auto;
      overflow-x: hidden;
    }

    .playlist-track
    {
      padding: 4px 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-track:hover
    {
      background: rgba(255, 255, 255, 0.1);
    }

    .playlist-track.active
    {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: bold;
    }
  </style>

  <script src="mp3particles/libs/vector.js" async></script>
</head>
<body onselectstart="return false;">
  <div class="page-wrapper">
    <div class="options">
      <button class="options__toggle-btn open-btn"></button>
      <div class="options-list hidden">
        <div class="options-list__option">
          <p class="option-name">Number: </p>
          <div class="options-list__number-input slider" step="3" value="0" data-for=".number-value">
            <div class="slider-thumb"></div>
          </div>
          <p class="option-value number-value">0</p>
        </div>  
        <div class="options-list__option">
          <p class="option-name">Color(HEX): </p>
          <input type="text" class="options-list__color-input" value="#" maxlength="7">
          <p class="option-name">Rainbow: </p>
          <input type="checkbox" class="options-list__rainbow">
        </div>
        <div class="options-list__option">
          <p class="option-name">Max radius: </p>
          <div class="options-list__radius-input slider" step="0.5" data-for=".radius-value">
            <div class="slider-thumb"></div>
          </div>
          <p class="option-value radius-value">0</p>
        </div>
        <div class="options-list__option">
          <p class="option-name">Bind distance: </p>
          <div class="options-list__distance-input slider" step="10" data-for=".distance-value">
            <div class="slider-thumb"></div>
          </div>
          <p class="option-value distance-value">0</p>
        </div>
        <div class="options-list__option">
          <p class="option-name">Max speed: </p>
          <div class="options-list__speed-input slider" step="0.5" data-for=".speed-value">
            <div class="slider-thumb"></div>
          </div>
          <p class="option-value speed-value">0</p>
        </div>
        <div class="options-list__option">
          <p class="option-name">Line width: </p>
          <div class="options-list__line-width-input slider" step="0.01" data-for=".line-width-value">
            <div class="slider-thumb"></div>
          </div>
          <p class="option-value line-width-value">0</p>
        </div>
        <div class="options-list__option">
          <p class="option-name">Line color: </p>
          <input type="text" class="options-list__line-color-input" value="#" maxlength="7">
        </div>
      </div>
    </div>
  </div>

  <script src="mp3particles/js/main.js" defer></script>

    <video id="videoStage" onloadstart="this.volume=1.0" style="display: none; width: 100%; height: 100%; z-index: 100; position: absolute; top: 0; left: 0;" autoplay controls></video>
    <audio id="audioStage" onloadstart="this.volume=1.0" style="display: none; width: 100%; z-index: 100; position: absolute; bottom: 0; left: 0;" autoplay controls></audio>

    <div id="playlist" style="display: none;">
      <div id="playlistControls">
        <button id="btnPrev">&#9664; Prev</button>
        <div id="playlistTitle"></div>
        <button id="btnNext">Next &#9654;</button>
      </div>
      <div id="playlistTracks"></div>
    </div>

    <script>
      function GetParameterByName(name, url)
      {
        // http://stackoverflow.com/questions/901115/how-can-i-get-query-string-values-in-javascript
          if (!url) url = window.location.href;
          name = name.replace(/[\[\]]/g, "\\$&");
          var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
              results = regex.exec(url);
          if (!results) return null;
          if (!results[2]) return '';
          var raw = results[2].replace(/\+/g, " ");
          try { return decodeURIComponent(raw); }
          catch(e) { return unescape(raw); }
      }

      function encodeFilePath(filePath)
      {
        // Percent-encode characters that are unsafe in file:// URLs
        // but preserve drive letters, path separators, and colons.
        // Also encode any bytes > 127 (e.g. Windows-1252 smart quotes).
        var regex = /[#'()!~\[\]{}|^ @&+,;=`\x80-\xff]/g;
        var result = '';
        var lastIndex = 0;
        var match = regex.exec(filePath);
        while( match !== null )
        {
          result += filePath.substring(lastIndex, match.index);
          var hex = match[0].charCodeAt(0).toString(16).toUpperCase();
          if( hex.length < 2 )
            hex = '0' + hex;
          result += '%' + hex;
          lastIndex = regex.lastIndex;
          match = regex.exec(filePath);
        }
        result += filePath.substring(lastIndex);
        return result;
      }

      function getFileName(filePath)
      {
        var lastSlash = Math.max(filePath.lastIndexOf('/'), filePath.lastIndexOf('\\'));
        var name = (lastSlash >= 0) ? filePath.substring(lastSlash + 1) : filePath;
        var lastDot = name.lastIndexOf('.');
        if( lastDot > 0 )
          name = name.substring(0, lastDot);
        return name;
      }

      function updatePlaylistUI()
      {
        var tracks = document.querySelectorAll('.playlist-track');
        for( var i = 0; i < tracks.length; i++ )
        {
          if( i === otherIndex )
            tracks[i].className = 'playlist-track active';
          else
            tracks[i].className = 'playlist-track';
        }

        var titleEl = document.getElementById('playlistTitle');
        if( otherIndex >= 0 && otherIndex < otherFiles.length )
          titleEl.textContent = getFileName(otherFiles[otherIndex]);
        else
          titleEl.textContent = '';
      }

      function playTrack(index)
      {
        if( index < 0 || index >= otherFiles.length )
          return;

        otherIndex = index;
        mediaFile.src = otherFiles[otherIndex];
        mediaSource.src = encodeFilePath(mediaFile.src);
        mediaStage.load();
        updatePlaylistUI();

        setTimeout(function()
        {
          mediaStage.play();
        }, 500);
      }

      function buildPlaylist()
      {
        var container = document.getElementById('playlistTracks');
        for( var i = 0; i < otherFiles.length; i++ )
        {
          var div = document.createElement('div');
          div.className = 'playlist-track';
          div.textContent = getFileName(otherFiles[i]);
          div.setAttribute('data-index', i);
          div.onclick = function()
          {
            var idx = parseInt(this.getAttribute('data-index'), 10);
            playTrack(idx);
          };
          container.appendChild(div);
        }

        document.getElementById('btnPrev').onclick = function()
        {
          var idx = otherIndex - 1;
          if( idx < 0 )
            idx = otherFiles.length - 1;
          playTrack(idx);
        };

        document.getElementById('btnNext').onclick = function()
        {
          var idx = otherIndex + 1;
          if( idx >= otherFiles.length )
            idx = 0;
          playTrack(idx);
        };

        document.getElementById('playlist').style.display = 'flex';
        updatePlaylistUI();
      }

      var otherIndex = -1;
      var otherFiles = [];
      var mediaStage, mediaSource;
      var mediaFile = GetParameterByName("file");
      if( !!mediaFile )
        mediaFile = JSON.parse(mediaFile);

      if( !!mediaFile )
      {
        var file = mediaFile.src;
        var path = '';
        var slashType = '/';
        var lastSlash = file.lastIndexOf('/');
        if( lastSlash < 0 )
        {
          lastSlash = file.lastIndexOf('\\');
          slashType = '\\';
        }

        if( lastSlash >= 0 )
        {
          path = file.substring(0, lastSlash);
          var fileOnly = file.substring(lastSlash+1);

          for( var i = 0; i < 100; i++ )
          {
            var otherFile = GetParameterByName("f" + i);
            if( !!!otherFile || otherFile == '' )
              break;

            otherFiles.push(path + slashType + otherFile);

            if( otherFile == fileOnly )
              otherIndex = i;
          }
        }

        mediaStage = (mediaFile.type.indexOf("audio") === 0) ? document.querySelector("#audioStage") : document.querySelector("#videoStage");

        mediaStage.addEventListener('ended', function()
        {
          otherIndex++;
          if( otherIndex >= otherFiles.length )
            otherIndex = 0;

          mediaFile.src = otherFiles[otherIndex];
          mediaSource.src = encodeFilePath(mediaFile.src);
          mediaStage.load();
          updatePlaylistUI();

          setTimeout(function()
          {
            mediaStage.play();
          }, 500);
        });

        if( otherFiles.length == 0 )
          mediaStage.loop = true;

        mediaSource = document.createElement("source");
        mediaSource.src = encodeFilePath(mediaFile.src);
        mediaSource.type = mediaFile.type;
        mediaStage.appendChild(mediaSource);
        mediaStage.style.display = "block";

        setTimeout(function()
        {
          mediaStage.play();
        }, 500);

        if( otherFiles.length > 0 )
          buildPlaylist();
      }
    </script>
  </body>
</html>
